name: Publish Godot web build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 Web export templates
        run: |
          set -eu
          apt-get update -qq && apt-get install -y -qq curl unzip ca-certificates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ ! -f "$TEMPLATE_DIR/web_nothreads_release.zip" ]; then
            curl -fL --retry 3 -o /tmp/godot-templates.tpz "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz"
            mkdir -p /tmp/godot-templates
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          fi
          test -f "$TEMPLATE_DIR/web_nothreads_release.zip"
      - name: Import assets
        run: |
          godot --headless --path . --editor --import --quit > /tmp/godot-import.log 2>&1 || { cat /tmp/godot-import.log; exit 1; }
          cat /tmp/godot-import.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|^ERROR:' /tmp/godot-import.log; then exit 1; fi
      - name: Export Web
        run: |
          mkdir -p build
          godot --headless --path . --export-release Web build/index.html > /tmp/godot-export.log 2>&1 || { cat /tmp/godot-export.log; exit 1; }
          cat /tmp/godot-export.log
          if grep -Eq 'SCRIPT ERROR|Parse Error|Failed to load script|^ERROR:' /tmp/godot-export.log; then exit 1; fi
          for artifact in index.html index.js index.wasm index.pck; do test -s "build/$artifact"; done
      - uses: actions/upload-artifact@v4
        with:
          name: factory-web
          path: build/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: export
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
